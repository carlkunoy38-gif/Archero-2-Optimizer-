[project]
name = "archero2-optimizer-backend"
version = "0.1.0"
description = "Backend API and optimizer engine for the Archero 2 Optimizer companion app."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "alembic>=1.13,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=5.0,<6.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.7,<1.0",
    "mypy>=1.11,<2.0",
]
# Only needed when ARCHERO_DATABASE_URL points at PostgreSQL instead of
# the SQLite default; see docs/installation.md.
postgres = [
    "psycopg[binary]>=3.2,<4.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["../tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# B008 ("no function calls in argument defaults") is a real footgun for
# actual mutable-default bugs, but FastAPI's dependency injection
# *requires* `Depends(...)`/`Query(...)` as a default value — that's the
# documented, intended usage, not an accidental mutable default.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
