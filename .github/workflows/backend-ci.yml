name: Backend CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: backend

jobs:
  test:
    name: Lint, type-check, test, and verify migrations
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend package (with dev extras)
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy)
        run: mypy app

      - name: Test (pytest)
        run: pytest

      - name: Alembic — upgrade to head
        run: alembic upgrade head

      - name: Alembic — check for undeclared model/migration drift
        run: alembic check

      - name: Alembic — downgrade to base
        run: alembic downgrade base

      - name: Alembic — upgrade to head again (round-trip check)
        run: alembic upgrade head
